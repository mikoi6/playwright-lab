<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Todo</title>
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:440px;margin:60px auto;padding:0 20px;color:#1c2733;}
  h1{font-size:22px;margin:0 0 18px;}
  .row{display:flex;gap:8px;}
  input[type=text]{flex:1;padding:9px 11px;border:1px solid #cfd6dd;border-radius:6px;font-size:15px;}
  button{padding:9px 14px;border:1px solid #cfd6dd;background:#fff;border-radius:6px;cursor:pointer;font-size:14px;}
  button.primary{background:#1d3f5e;color:#fff;border-color:#1d3f5e;}
  ul{list-style:none;padding:0;margin:18px 0 0;}
  li{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eceff2;}
  li span{flex:1;}
  li.done span{text-decoration:line-through;color:#9aa5b1;}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:#5b6b7a;}
  .empty{color:#9aa5b1;font-size:14px;padding:18px 0;}
</style>
</head>
<body>
  <h1>Todo</h1>

  <div class="row">
    <input type="text" id="new-todo" data-testid="new-todo" placeholder="要做什么？">
    <button class="primary" id="add" data-testid="add">添加</button>
  </div>

  <ul id="list"></ul>

  <div class="bar">
    <span data-testid="count">0 项 / 0 未完成</span>
    <button id="clear-done" data-testid="clear-done">清除已完成</button>
  </div>

<script>
const api = {
  list:   () => fetch('/api/todos').then(r => r.json()),
  add:    (title) => fetch('/api/todos', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title }) }),
  toggle: (id, done) => fetch('/api/todos/' + id, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done }) }),
  remove: (id) => fetch('/api/todos/' + id, { method: 'DELETE' }),
};

async function render() {
  const list = await api.list();
  const ul = document.getElementById('list');
  ul.innerHTML = '';

  if (list.length === 0) {
    ul.innerHTML = '<li class="empty" data-testid="empty">还没有待办</li>';
  } else {
    list.forEach(t => {
      const li = document.createElement('li');
      li.dataset.testid = 'todo-item';
      li.className = t.done ? 'done' : '';
      li.innerHTML =
        '<input type="checkbox" data-testid="toggle">' +
        '<span data-testid="todo-title"></span>' +
        '<button data-testid="delete">删除</button>';

      li.querySelector('[data-testid=toggle]').checked = t.done;
      li.querySelector('span').textContent = t.title;
      li.querySelector('[data-testid=toggle]').onchange = async () => {
        await api.toggle(t.id, !t.done);
        render();
      };
      li.querySelector('[data-testid=delete]').onclick = async () => {
        await api.remove(t.id);
        render();
      };
      ul.appendChild(li);
    });
  }

  const done = list.filter(t => t.done).length;
  document.querySelector('[data-testid=count]').textContent =
    list.length + ' 项 / ' + (list.length - done) + ' 未完成';
}

document.getElementById('add').onclick = async () => {
  const input = document.getElementById('new-todo');
  const title = input.value.trim();
  if (!title) return;
  await api.add(title);
  input.value = '';
  render();
};

document.getElementById('clear-done').onclick = async () => {
  const list = await api.list();
  for (const t of list.filter(x => x.done)) await api.remove(t.id);
  render();
};

render();
</script>
</body>
</html>
